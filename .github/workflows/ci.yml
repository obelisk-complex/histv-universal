# CI: run tests and checks on every push/PR to main
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  RUST_VERSION: "1.93.1"

jobs:
  test:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # 2026-03-27
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            ffmpeg

      - name: Rustfmt check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Run library and integration tests
        working-directory: src-tauri
        run: cargo test --features dovi,cli

      - name: Run binary crate tests
        working-directory: src-tauri
        run: cargo test --bin histv-cli --features cli

      - name: Feature combination check (CLI-only, no dovi)
        working-directory: src-tauri
        run: cargo check --lib --bin histv-cli --features cli

      - name: Feature combination check (all features)
        working-directory: src-tauri
        run: cargo check --features dovi,cli,downloader

      - name: Clippy lint check
        working-directory: src-tauri
        run: cargo clippy --features dovi,cli -- -D warnings

      - name: Frontend JS tests
        run: node --test src/js/lib.test.js

  # Cross-platform cargo check (compilation only, no tests)
  check-platforms:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            features: "dovi,cli"
          - os: windows-2022
            features: "dovi,cli"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # 2026-03-27
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri

      - name: Cargo check (all targets)
        working-directory: src-tauri
        run: cargo check --features ${{ matrix.features }} --all-targets
