# CI: run tests and checks on every push/PR to main
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-flight run when a newer commit lands on the same branch/PR, so
# force-pushes and rapid pushes don't queue up redundant macOS/Windows runners.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUST_VERSION: "1.93.1"

jobs:
  test:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1 # build/test needs only the tip commit, not full history

      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # action commit 2026-03-27; Rust version pinned via RUST_VERSION
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri
          # Only persist the cache from main; PR runs restore but don't write,
          # so a failing or experimental branch can't poison the shared cache.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            ffmpeg

      - name: Rustfmt check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Run tests (library, integration, CLI binary)
        working-directory: src-tauri
        # `--features dovi,cli` already compiles and tests every crate in the
        # workspace, histv-cli included; a separate `--bin histv-cli` run added
        # no unique coverage, so it was removed.
        run: cargo test --features dovi,cli

      - name: Feature combination check (CLI-only, no dovi)
        working-directory: src-tauri
        run: cargo check --lib --bin histv-cli --features cli

      - name: Feature combination check (all features)
        working-directory: src-tauri
        run: cargo check --features dovi,cli,downloader

      - name: Clippy lint check
        working-directory: src-tauri
        run: cargo clippy --features dovi,cli -- -D warnings

      - name: Frontend JS tests
        run: node --test src/js/lib.test.js

  # Cross-platform cargo check (compilation only, no tests)
  check-platforms:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            features: "dovi,cli"
          - os: windows-2022
            features: "dovi,cli"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1 # build/test needs only the tip commit, not full history

      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # action commit 2026-03-27; Rust version pinned via RUST_VERSION
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri
          # Only persist the cache from main; PR runs restore but don't write,
          # so a failing or experimental branch can't poison the shared cache.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Cargo check (all targets)
        working-directory: src-tauri
        run: cargo check --features ${{ matrix.features }} --all-targets

  # Scan the locked dependency tree for known RustSec advisories. Runs in
  # parallel with the test/check jobs so it doesn't add to the critical path.
  audit:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # action commit 2026-03-27; Rust version pinned via RUST_VERSION
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit dependencies (fails on known vulnerabilities)
        working-directory: src-tauri
        run: cargo audit
