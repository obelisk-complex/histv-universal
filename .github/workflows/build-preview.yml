# Preview build: produce runnable, downloadable Windows artefacts for a
# feature branch WITHOUT cutting a release or touching `main`.
#
# Triggered automatically when the `revamp-rail` (or any `preview/**`) branch
# is pushed, and on demand via the Actions tab. It reuses the same
# `build-platform.yml` the real release uses, so what you download here is
# built exactly like a shipped Windows build:
#   - histv-windows.exe        portable GUI
#   - histv-windows-full.zip   GUI + bundled ffmpeg/ffprobe (run without install)
#   - histv-cli-windows.exe    headless CLI
#   - histv-cli-windows-full.zip
#
# The Linux Flatpak preview is produced separately by dispatching the existing
# `build-flatpak.yml` against the same ref (it already supports workflow_dispatch
# and uploads the .flatpak as an artefact).
name: Preview Build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (branch, tag, or SHA)"
        required: false
        default: "revamp-rail"
  push:
    branches:
      - revamp-rail
      - "preview/**"
    # Don't spin a 25-min Tauri build for changes that can't affect the app
    # (the from-source ffmpeg workflow, docs, scratch, markdown).
    paths-ignore:
      - ".github/workflows/build-ffmpeg.yml"
      - "bakeoff/**"
      - "docs/**"
      - "**/*.md"

permissions:
  contents: read

# Only keep the newest preview build per ref; cancel superseded ones so a
# rapid series of pushes doesn't pile up redundant 20-minute builds.
concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    # Reuse the production build pipeline; same toolchain, same bundling.
    uses: ./.github/workflows/build-platform.yml
    with:
      os: windows-2022
      target: x86_64-pc-windows-msvc
      label: windows
      bundles: ""
      # On push, github.event.inputs is empty, so github.sha (the pushed commit)
      # is used. On dispatch, the ref input defaults to "revamp-rail"; github.sha
      # is only the fallback if the user clears it. Note: the reusable workflow
      # *definition* always comes from this workflow's commit (github.sha); only
      # the *code* that gets built is checked out at inputs.ref.
      ref: ${{ github.event.inputs.ref || github.sha }}
