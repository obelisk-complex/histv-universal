# Release: build all platforms and upload assets to the GitHub Release
name: Release

on:
  release:
    types: [published]

# Don't cancel an in-flight release (it may be mid-upload); this just stops two
# runs for the same tag from racing.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Least privilege: granted per-job below. Only the upload job needs write.
permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux
            bundles: appimage
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            label: windows
            bundles: ""
          - os: macos-14
            target: aarch64-apple-darwin
            label: macos-arm64
            bundles: dmg
          - os: macos-14
            target: x86_64-apple-darwin
            label: macos-x64
            bundles: dmg

    uses: ./.github/workflows/build-platform.yml
    with:
      os: ${{ matrix.os }}
      target: ${{ matrix.target }}
      label: ${{ matrix.label }}
      bundles: ${{ matrix.bundles }}
      ref: ${{ github.ref }}
      # ci.yml already ran the full test suite on main before this tag, so the
      # per-platform build doesn't need to re-run it.
      run_tests: false

  release:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write # OIDC token for the build-provenance attestation
      attestations: write # write the attestation to the repo

    steps:
      - name: Download all artefacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          merge-multiple: true

      - name: List assets
        run: find release-assets -type f

      # Signed, verifiable record of what produced each release asset
      # (verify with `gh attestation verify <file> -R <owner/repo>`).
      - name: Generate SLSA build-provenance attestations
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: release-assets/**/*

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          files: release-assets/**/*
          generate_release_notes: true
          draft: false
          prerelease: false
