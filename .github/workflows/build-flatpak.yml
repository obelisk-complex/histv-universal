# Build a Flathub-grade Flatpak from source using the real manifest
name: Build Flatpak

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (branch, tag, or SHA)"
        required: false
        default: "main"

permissions:
  contents: write

env:
  GNOME_RUNTIME_VERSION: "50"
  RUST_EXT_VERSION: "25.08"

jobs:
  validate-ffmpeg:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Extract FFmpeg URL and sha256
        id: ffmpeg-meta
        run: |
          python3 << 'PYEOF'
          import yaml, os
          data = yaml.safe_load(open('com.histv.encoder.yml'))
          mod = next(m for m in data['modules'] if m['name'] == 'ffmpeg')
          src = next(s for s in mod['sources'] if s['type'] == 'archive')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
              fh.write(f"url={src['url']}\n")
              fh.write(f"sha256={src['sha256']}\n")
          PYEOF

      - name: Download and verify FFmpeg
        run: |
          set -e
          curl -fSL --retry 3 -o ffmpeg.tar.xz "${{ steps.ffmpeg-meta.outputs.url }}"
          echo "${{ steps.ffmpeg-meta.outputs.sha256 }}  ffmpeg.tar.xz" | sha256sum -c -
          mkdir -p ffmpeg-extract ffmpeg-bin
          tar xf ffmpeg.tar.xz --strip-components=1 -C ffmpeg-extract
          FFMPEG=$(find ffmpeg-extract -name "ffmpeg" -not -name "ffprobe" -type f | head -1)
          cp "$FFMPEG" ffmpeg-bin/ffmpeg
          chmod +x ffmpeg-bin/ffmpeg

      - name: Smoke-test FFmpeg
        run: |
          set -e
          ffmpeg-bin/ffmpeg -version
          ffmpeg-bin/ffmpeg -f lavfi -i testsrc2=size=192x108:rate=1 \
            -vframes 5 -c:v libx265 -preset ultrafast /tmp/smoke_hevc.mkv
          test -s /tmp/smoke_hevc.mkv
          ffmpeg-bin/ffmpeg -f lavfi -i testsrc2=size=192x108:rate=1 \
            -vframes 5 -c:v libx264 -preset ultrafast /tmp/smoke_h264.mp4
          test -s /tmp/smoke_h264.mp4

  build:
    runs-on: ubuntu-22.04
    needs: validate-ffmpeg

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Cache Flatpak SDK
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: /var/lib/flatpak
          key: flatpak-sdk-gnome-${{ env.GNOME_RUNTIME_VERSION }}-rust-${{ env.RUST_EXT_VERSION }}

      - name: Install Flatpak and flatpak-builder
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder

      - name: Add Flathub remote
        run: |
          set -e
          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Install GNOME SDK, Platform, and Rust extension
        run: |
          set -e
          sudo flatpak install -y flathub \
            org.gnome.Platform//${{ env.GNOME_RUNTIME_VERSION }} \
            org.gnome.Sdk//${{ env.GNOME_RUNTIME_VERSION }} \
            org.freedesktop.Sdk.Extension.rust-stable//${{ env.RUST_EXT_VERSION }}

      # Fix root-owned .lock files so actions/cache can tar the directory
      - name: Fix Flatpak SDK permissions for caching
        run: sudo chmod -R a+r /var/lib/flatpak

      - name: Build Flatpak from source manifest
        run: |
          set -e
          flatpak-builder --force-clean --repo=flatpak-repo flatpak-build com.histv.encoder.yml

      - name: Export Flatpak bundle
        run: |
          set -e
          flatpak build-bundle flatpak-repo histv-linux.flatpak com.histv.encoder

      - name: Upload artefact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: histv-linux-flatpak
          path: histv-linux.flatpak
          retention-days: 14

      - name: Upload to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.2.2
        with:
          files: histv-linux.flatpak
