# Build a Flathub-grade Flatpak from source using the real manifest
name: Build Flatpak

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (branch, tag, or SHA)"
        required: false
        default: "main"

# Don't cancel an in-flight build (a release build may be mid-upload); this just
# stops duplicate runs for the same ref from racing.
concurrency:
  group: flatpak-${{ github.event.inputs.ref || github.ref }}
  cancel-in-progress: false

# Least privilege: granted per-job below. Only the upload step needs write.
permissions:
  contents: read

env:
  GNOME_RUNTIME_VERSION: "50"
  RUST_EXT_VERSION: "25.08"

jobs:
  validate-ffmpeg:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 1

      - name: Extract FFmpeg URL and sha256
        id: ffmpeg-meta
        run: |
          set -e
          python3 - <<'PYEOF'
          import yaml, os
          data = yaml.safe_load(open('com.histv.encoder.yml'))
          mod = next(m for m in data['modules'] if m['name'] == 'ffmpeg')
          src = next(s for s in mod['sources'] if s['type'] == 'archive')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
              fh.write(f"url={src['url']}\n")
              fh.write(f"sha256={src['sha256']}\n")
          PYEOF

      - name: Download and verify FFmpeg
        run: |
          set -e
          curl -fSL --retry 3 -o ffmpeg.tar.xz "${{ steps.ffmpeg-meta.outputs.url }}"
          echo "${{ steps.ffmpeg-meta.outputs.sha256 }}  ffmpeg.tar.xz" | sha256sum -c -
          mkdir -p ffmpeg-extract ffmpeg-bin
          tar xf ffmpeg.tar.xz --strip-components=1 -C ffmpeg-extract
          FFMPEG=$(find ffmpeg-extract -name "ffmpeg" -not -name "ffprobe" -type f | head -1)
          [ -n "$FFMPEG" ] || { echo "ERROR: ffmpeg binary not found in archive"; exit 1; }
          cp "$FFMPEG" ffmpeg-bin/ffmpeg
          chmod +x ffmpeg-bin/ffmpeg

      - name: Smoke-test FFmpeg
        run: |
          set -e
          ffmpeg-bin/ffmpeg -version
          ffmpeg-bin/ffmpeg -encoders 2>/dev/null | grep -q libx265 || { echo "ERROR: libx265 not available in this ffmpeg build"; exit 1; }
          ffmpeg-bin/ffmpeg -encoders 2>/dev/null | grep -q libx264 || { echo "ERROR: libx264 not available in this ffmpeg build"; exit 1; }
          ffmpeg-bin/ffmpeg -f lavfi -i testsrc2=size=192x108:rate=1 \
            -vframes 5 -c:v libx265 -preset ultrafast /tmp/smoke_hevc.mkv
          test -s /tmp/smoke_hevc.mkv
          ffmpeg-bin/ffmpeg -f lavfi -i testsrc2=size=192x108:rate=1 \
            -vframes 5 -c:v libx264 -preset ultrafast /tmp/smoke_h264.mp4
          test -s /tmp/smoke_h264.mp4

  build:
    runs-on: ubuntu-22.04
    needs: validate-ffmpeg
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 1

      - name: Install Flatpak and flatpak-builder
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder

      # Cache the *user* Flatpak installation (~/.local/share/flatpak). The system
      # path (/var/lib/flatpak) is root-owned, so actions/cache cannot restore into
      # it - the previous system-wide cache silently never restored. The user
      # installation is owned by the runner user, so caching works, and the heavy
      # SDK install is skipped on a cache hit.
      - name: Cache Flatpak SDK (user installation)
        id: cache-flatpak-sdk
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.local/share/flatpak
          key: flatpak-sdk-user-gnome-${{ env.GNOME_RUNTIME_VERSION }}-rust-${{ env.RUST_EXT_VERSION }}

      - name: Add Flathub remote (user)
        run: flatpak --user remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Install GNOME SDK, Platform, and Rust extension (user)
        if: steps.cache-flatpak-sdk.outputs.cache-hit != 'true'
        run: |
          set -e
          flatpak --user install -y flathub \
            org.gnome.Platform//${{ env.GNOME_RUNTIME_VERSION }} \
            org.gnome.Sdk//${{ env.GNOME_RUNTIME_VERSION }} \
            org.freedesktop.Sdk.Extension.rust-stable//${{ env.RUST_EXT_VERSION }}

      - name: Build Flatpak from source manifest
        run: |
          set -e
          flatpak-builder --user --force-clean --repo=flatpak-repo flatpak-build com.histv.encoder.yml

      - name: Export Flatpak bundle
        run: |
          set -e
          flatpak build-bundle flatpak-repo histv-linux.flatpak com.histv.encoder

      - name: Upload artefact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: histv-linux-flatpak
          path: histv-linux.flatpak
          retention-days: 14

      - name: Upload to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          files: histv-linux.flatpak
