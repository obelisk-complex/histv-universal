# Build a histv-tailored, fully source-pinned static ffmpeg/ffprobe.
#
# Why this exists: histv used to download prebuilt ffmpeg from third parties
# (BtbN dated autobuilds, gyan.dev, evermeet.cx). The BtbN pin expired upstream
# and 404'd the whole build. Building from pinned source removes that failure
# mode permanently, gives a native macOS arm64 binary (evermeet is Intel-only),
# and lets us strip ffmpeg to exactly what histv uses.
#
# Feature set + recipe come from bakeoff/qa/ffmpeg-custom-build-plan.md:
# "curated GPL static" - x264 + x265 (multilib 8/10/12-bit for HDR) + SVT-AV1 +
# zimg (zscale tonemap) + HW accel, with network/devices/ffplay stripped. No
# Dolby Vision in ffmpeg (histv does DV/HDR10+ in Rust). No source patches.
#
# Output is published to the `ffmpeg-experimental` prerelease for test builds.
name: Build ffmpeg (custom)

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish built binaries to the ffmpeg-experimental prerelease"
        type: boolean
        default: true
  # Rebuild whenever this workflow itself changes (so we can iterate on the build
  # from a feature branch without it being on the default branch for dispatch, and
  # without running on unrelated pushes).
  push:
    branches: [revamp-rail, "preview/**"]
    paths: [".github/workflows/build-ffmpeg.yml"]

permissions:
  contents: read

concurrency:
  group: build-ffmpeg
  cancel-in-progress: true

env:
  # Source pins (verified to exist at authoring time; recorded with SHA256 in
  # the build log). Bump deliberately, never to a floating branch/latest.
  FFMPEG_TAG: "n8.1.1"
  X264_COMMIT: "b35605ace3ddf7c1a5d67a2eb553f034aef41d55" # videolan/x264 stable
  X265_VER: "4.2" # videolan release tarball; 4.2 CMakeLists is CMake-4.x clean (4.1 set removed policies to OLD)
  X265_SHA256: "40b1ea0453e0309f0eba934e0ddf533f8f6295966679e8894e8f1c1c8d5e1210"
  SVTAV1_TAG: "v3.1.2"
  ZIMG_TAG: "release-3.0.5"
  NVHEADERS_TAG: "n12.2.72.0"
  # AMD HW encode (h264/hevc/av1_amf). Header-only: ffmpeg's configure requires
  # AMF_VERSION >= 0x0001000400240000 (= 1.4.36); the runtime lib is the user's
  # AMD GPU driver. linux + windows (not a macOS concept).
  AMF_TAG: "v1.4.36"
  # Intel QSV via the oneVPL dispatcher (h264/hevc/av1_qsv). ffmpeg
  # --enable-libvpl probes pkg-config for "vpl >= 2.6". linux + windows.
  LIBVPL_TAG: "v2.15.0"

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Install build tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            nasm cmake ninja-build meson pkg-config build-essential git \
            autoconf automake libtool \
            libva-dev libdrm-dev
          echo "PREFIX=$HOME/ffbuild/prefix" >> "$GITHUB_ENV"
          echo "SRC=$HOME/ffbuild/src" >> "$GITHUB_ENV"

      - name: Prepare prefix
        run: |
          set -euo pipefail
          mkdir -p "$PREFIX/lib/pkgconfig" "$PREFIX/include" "$SRC"
          echo "PKG_CONFIG_PATH=$PREFIX/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Build x264 (static, pic, 8+10-bit)
        run: |
          set -euo pipefail
          cd "$SRC"
          git clone https://code.videolan.org/videolan/x264.git
          cd x264 && git checkout "$X264_COMMIT"
          ./configure --prefix="$PREFIX" --enable-static --enable-pic \
            --bit-depth=all --disable-cli --disable-opencl
          make -j"$(nproc)"
          make install

      - name: Build x265 (multilib 8/10/12-bit, static)
        run: |
          set -euo pipefail
          cd "$SRC"
          curl -fsSL --retry 3 -o x265.tar.gz "https://download.videolan.org/pub/videolan/x265/x265_${X265_VER}.tar.gz"
          echo "${X265_SHA256}  x265.tar.gz" | sha256sum -c -
          tar xzf x265.tar.gz
          cd "x265_${X265_VER}/source"
          mkdir -p 8bit 10bit 12bit

          # 12-bit (Main12)
          cmake -S . -B 12bit -G Ninja \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DHIGH_BIT_DEPTH=ON -DMAIN12=ON -DEXPORT_C_API=OFF \
            -DENABLE_SHARED=OFF -DENABLE_CLI=OFF -DENABLE_HDR10_PLUS=OFF
          ninja -C 12bit

          # 10-bit (Main10)
          cmake -S . -B 10bit -G Ninja \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DHIGH_BIT_DEPTH=ON -DEXPORT_C_API=OFF \
            -DENABLE_SHARED=OFF -DENABLE_CLI=OFF -DENABLE_HDR10_PLUS=OFF
          ninja -C 10bit

          # 8-bit linked against the 10/12-bit libs
          ln -sf ../10bit/libx265.a 8bit/libx265_main10.a
          ln -sf ../12bit/libx265.a 8bit/libx265_main12.a
          cmake -S . -B 8bit -G Ninja \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DENABLE_SHARED=OFF -DENABLE_CLI=OFF -DENABLE_HDR10_PLUS=OFF \
            -DEXTRA_LIB="x265_main10.a;x265_main12.a" \
            -DEXTRA_LINK_FLAGS=-L. -DLINKED_10BIT=ON -DLINKED_12BIT=ON
          ninja -C 8bit
          ninja -C 8bit install

          # Merge the three static archives into one fat libx265.a
          cd 8bit
          mv libx265.a libx265_main.a
          ar -M <<'EOF'
          CREATE libx265.a
          ADDLIB libx265_main.a
          ADDLIB libx265_main10.a
          ADDLIB libx265_main12.a
          SAVE
          END
          EOF
          ranlib libx265.a
          cp -f libx265.a "$PREFIX/lib/libx265.a"

      - name: Build SVT-AV1 (static, no LTO)
        run: |
          set -euo pipefail
          cd "$SRC"
          git clone --depth 1 -b "$SVTAV1_TAG" https://gitlab.com/AOMediaCodec/SVT-AV1.git
          cmake -S SVT-AV1 -B SVT-AV1/Build -G Ninja \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF -DENABLE_AVX512=ON -DSVT_AV1_LTO=OFF
          ninja -C SVT-AV1/Build install

      - name: Build zimg (static)
        run: |
          set -euo pipefail
          cd "$SRC"
          git clone --depth 1 -b "$ZIMG_TAG" --recurse-submodules https://github.com/sekrit-twc/zimg.git
          cd zimg
          ./autogen.sh
          ./configure --prefix="$PREFIX" --enable-static --disable-shared --with-pic
          make -j"$(nproc)"
          make install

      - name: Install nv-codec-headers (nvenc)
        run: |
          set -euo pipefail
          cd "$SRC"
          git clone --depth 1 -b "$NVHEADERS_TAG" https://github.com/FFmpeg/nv-codec-headers.git
          make -C nv-codec-headers install PREFIX="$PREFIX"

      - name: Install AMF headers (AMD HW encode)
        run: |
          set -euo pipefail
          cd "$SRC"
          git clone --depth 1 -b "$AMF_TAG" https://github.com/GPUOpen-LibrariesAndSDKs/AMF.git
          # ffmpeg's configure checks for <AMF/core/Version.h>; AMF ships the
          # headers under amf/public/include. Header-only - the runtime AMF lib
          # is the user's AMD GPU driver, loaded at runtime.
          mkdir -p "$PREFIX/include/AMF"
          cp -a AMF/amf/public/include/. "$PREFIX/include/AMF/"

      - name: Build libvpl (Intel QSV via oneVPL, static)
        run: |
          set -euo pipefail
          cd "$SRC"
          git clone --depth 1 -b "$LIBVPL_TAG" https://github.com/intel/libvpl.git
          # The oneVPL dispatcher. Builds shared by default; force static so the
          # ffmpeg binary stays self-contained. Installs lib/pkgconfig/vpl.pc,
          # which ffmpeg --enable-libvpl probes for (needs vpl >= 2.6).
          cmake -S libvpl -B libvpl/_build -G Ninja \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTS=OFF -DBUILD_TOOLS=OFF -DBUILD_EXAMPLES=OFF
          ninja -C libvpl/_build
          ninja -C libvpl/_build install

      - name: Configure + build ffmpeg
        run: |
          set -euo pipefail
          cd "$SRC"
          git clone --depth 1 -b "$FFMPEG_TAG" https://github.com/FFmpeg/FFmpeg.git ffmpeg
          cd ffmpeg
          ./configure \
            --prefix="$PREFIX" \
            --pkg-config-flags=--static \
            --extra-cflags="-I$PREFIX/include" \
            --extra-ldflags="-L$PREFIX/lib" \
            --extra-libs="-lstdc++ -lpthread -lm -ldl" \
            --enable-gpl --enable-version3 \
            --enable-static --disable-shared \
            --disable-debug --disable-doc --disable-ffplay --enable-ffprobe \
            --disable-network --disable-indevs --disable-outdevs \
            --enable-libx264 --enable-libx265 --enable-libsvtav1 --enable-libzimg \
            --enable-vaapi --enable-libdrm --enable-ffnvcodec --enable-amf --enable-libvpl \
            --disable-filter=amf_capture,sr_amf,vpp_amf \
            --enable-runtime-cpudetect
          make -j"$(nproc)"

      - name: Verify feature set
        run: |
          set -euo pipefail
          cd "$SRC/ffmpeg"
          ./ffmpeg -hide_banner -version
          echo "--- encoders ---"
          ./ffmpeg -hide_banner -encoders | grep -E 'libx264|libx265|libsvtav1|nvenc|vaapi' || { echo "MISSING expected encoder"; exit 1; }
          # AMD (amf) + Intel (qsv) HW encoders: assert they compiled in. No
          # runtime encode - the CI runner has no AMD/Intel GPU, so these only
          # need to be *listed* (compile-time proof), not executed.
          ./ffmpeg -hide_banner -encoders | grep -q hevc_amf || { echo "MISSING amf (AMD) encoder"; exit 1; }
          ./ffmpeg -hide_banner -encoders | grep -q hevc_qsv || { echo "MISSING qsv (Intel) encoder"; exit 1; }
          echo "--- filters ---"
          ./ffmpeg -hide_banner -filters | grep -E 'zscale|tonemap' || { echo "MISSING zscale/tonemap"; exit 1; }
          echo "--- bsfs ---"
          ./ffmpeg -hide_banner -bsfs | grep -E 'hevc_mp4toannexb|hevc_metadata' || { echo "MISSING hevc bsf"; exit 1; }
          echo "--- smoke encode (x264 + x265 8/10-bit) ---"
          # lavfi is an input *device*, which we --disable-indevs (histv only reads
          # real files), so synthesise raw frames from /dev/zero via the rawvideo
          # demuxer instead of testsrc.
          ./ffmpeg -hide_banner -y -f rawvideo -pix_fmt yuv420p -video_size 192x108 -framerate 5 -i /dev/zero -frames:v 5 -c:v libx264 -preset ultrafast /tmp/h264.mp4
          ./ffmpeg -hide_banner -y -f rawvideo -pix_fmt yuv420p -video_size 192x108 -framerate 5 -i /dev/zero -frames:v 5 -c:v libx265 -preset ultrafast /tmp/hevc.mkv
          ./ffmpeg -hide_banner -y -f rawvideo -pix_fmt yuv420p10le -video_size 192x108 -framerate 5 -i /dev/zero -frames:v 5 -c:v libx265 -preset ultrafast /tmp/hevc10.mkv
          test -s /tmp/h264.mp4 && test -s /tmp/hevc.mkv && test -s /tmp/hevc10.mkv

      - name: Collect + checksum
        run: |
          set -euo pipefail
          mkdir -p out
          cp "$SRC/ffmpeg/ffmpeg" out/ffmpeg
          cp "$SRC/ffmpeg/ffprobe" out/ffprobe
          strip out/ffmpeg out/ffprobe || true
          ( cd out && sha256sum ffmpeg ffprobe | tee SHA256SUMS )
          tar -C out -czf histv-ffmpeg-linux-x64.tar.gz ffmpeg ffprobe SHA256SUMS
          ls -lh out histv-ffmpeg-linux-x64.tar.gz

      - name: Upload artefact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: histv-ffmpeg-linux-x64
          path: histv-ffmpeg-linux-x64.tar.gz
          retention-days: 30

  macos:
    runs-on: macos-14 # Apple Silicon (arm64) - native build, fixes the Rosetta defect
    steps:
      - name: Install build tooling
        run: |
          set -euo pipefail
          brew install nasm cmake ninja meson pkg-config autoconf automake libtool
          echo "PREFIX=$HOME/ffbuild/prefix" >> "$GITHUB_ENV"
          echo "SRC=$HOME/ffbuild/src" >> "$GITHUB_ENV"

      - name: Prepare prefix
        run: |
          set -euo pipefail
          mkdir -p "$PREFIX/lib/pkgconfig" "$PREFIX/include" "$SRC"
          echo "PKG_CONFIG_PATH=$PREFIX/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Build x264 (static, pic, 8+10-bit)
        run: |
          set -euo pipefail
          cd "$SRC"
          git clone https://code.videolan.org/videolan/x264.git
          cd x264 && git checkout "$X264_COMMIT"
          ./configure --prefix="$PREFIX" --enable-static --enable-pic \
            --bit-depth=all --disable-cli --disable-opencl
          make -j"$(sysctl -n hw.ncpu)"
          make install

      - name: Build x265 (multilib 8/10/12-bit, static)
        run: |
          set -euo pipefail
          cd "$SRC"
          curl -fsSL --retry 3 -o x265.tar.gz "https://download.videolan.org/pub/videolan/x265/x265_${X265_VER}.tar.gz"
          echo "${X265_SHA256}  x265.tar.gz" | shasum -a 256 -c -
          tar xzf x265.tar.gz
          cd "x265_${X265_VER}/source"
          mkdir -p 8bit 10bit 12bit
          cmake -S . -B 12bit -G Ninja -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DHIGH_BIT_DEPTH=ON -DMAIN12=ON -DEXPORT_C_API=OFF \
            -DENABLE_SHARED=OFF -DENABLE_CLI=OFF -DENABLE_HDR10_PLUS=OFF
          ninja -C 12bit
          cmake -S . -B 10bit -G Ninja -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DHIGH_BIT_DEPTH=ON -DEXPORT_C_API=OFF \
            -DENABLE_SHARED=OFF -DENABLE_CLI=OFF -DENABLE_HDR10_PLUS=OFF
          ninja -C 10bit
          ln -sf ../10bit/libx265.a 8bit/libx265_main10.a
          ln -sf ../12bit/libx265.a 8bit/libx265_main12.a
          cmake -S . -B 8bit -G Ninja -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DENABLE_SHARED=OFF -DENABLE_CLI=OFF -DENABLE_HDR10_PLUS=OFF \
            -DEXTRA_LIB="x265_main10.a;x265_main12.a" \
            -DEXTRA_LINK_FLAGS=-L. -DLINKED_10BIT=ON -DLINKED_12BIT=ON
          ninja -C 8bit
          ninja -C 8bit install
          # macOS ar lacks the -M (MRI script) mode; merge with Apple libtool.
          cd 8bit
          mv libx265.a libx265_main.a
          libtool -static -o libx265.a libx265_main.a libx265_main10.a libx265_main12.a
          cp -f libx265.a "$PREFIX/lib/libx265.a"

      - name: Build SVT-AV1 (static, no LTO)
        run: |
          set -euo pipefail
          cd "$SRC"
          git clone --depth 1 -b "$SVTAV1_TAG" https://gitlab.com/AOMediaCodec/SVT-AV1.git
          cmake -S SVT-AV1 -B SVT-AV1/Build -G Ninja \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF -DSVT_AV1_LTO=OFF
          ninja -C SVT-AV1/Build install

      - name: Build zimg (static)
        run: |
          set -euo pipefail
          cd "$SRC"
          git clone --depth 1 -b "$ZIMG_TAG" --recurse-submodules https://github.com/sekrit-twc/zimg.git
          cd zimg
          ./autogen.sh
          ./configure --prefix="$PREFIX" --enable-static --disable-shared --with-pic
          make -j"$(sysctl -n hw.ncpu)"
          make install

      - name: Configure + build ffmpeg
        run: |
          set -euo pipefail
          cd "$SRC"
          git clone --depth 1 -b "$FFMPEG_TAG" https://github.com/FFmpeg/FFmpeg.git ffmpeg
          cd ffmpeg
          ./configure \
            --prefix="$PREFIX" \
            --pkg-config-flags=--static \
            --extra-cflags="-I$PREFIX/include" \
            --extra-ldflags="-L$PREFIX/lib" \
            --extra-libs="-lc++" \
            --enable-gpl --enable-version3 \
            --enable-static --disable-shared \
            --disable-debug --disable-doc --disable-ffplay --enable-ffprobe \
            --disable-network --disable-indevs --disable-outdevs \
            --enable-libx264 --enable-libx265 --enable-libsvtav1 --enable-libzimg \
            --enable-videotoolbox --enable-audiotoolbox \
            --arch=arm64 --enable-runtime-cpudetect
          make -j"$(sysctl -n hw.ncpu)"

      - name: Verify feature set
        run: |
          set -euo pipefail
          cd "$SRC/ffmpeg"
          ./ffmpeg -hide_banner -version
          ./ffmpeg -hide_banner -encoders | grep -E 'libx264|libx265|libsvtav1|videotoolbox' || { echo "MISSING expected encoder"; exit 1; }
          ./ffmpeg -hide_banner -filters | grep -E 'zscale|tonemap' || { echo "MISSING zscale/tonemap"; exit 1; }
          ./ffmpeg -hide_banner -bsfs | grep -E 'hevc_mp4toannexb|hevc_metadata' || { echo "MISSING hevc bsf"; exit 1; }
          ./ffmpeg -hide_banner -y -f rawvideo -pix_fmt yuv420p -video_size 192x108 -framerate 5 -i /dev/zero -frames:v 5 -c:v libx264 -preset ultrafast /tmp/h264.mp4
          ./ffmpeg -hide_banner -y -f rawvideo -pix_fmt yuv420p -video_size 192x108 -framerate 5 -i /dev/zero -frames:v 5 -c:v libx265 -preset ultrafast /tmp/hevc.mkv
          ./ffmpeg -hide_banner -y -f rawvideo -pix_fmt yuv420p10le -video_size 192x108 -framerate 5 -i /dev/zero -frames:v 5 -c:v libx265 -preset ultrafast /tmp/hevc10.mkv
          test -s /tmp/h264.mp4 && test -s /tmp/hevc.mkv && test -s /tmp/hevc10.mkv

      - name: Collect + checksum
        run: |
          set -euo pipefail
          mkdir -p out
          cp "$SRC/ffmpeg/ffmpeg" out/ffmpeg
          cp "$SRC/ffmpeg/ffprobe" out/ffprobe
          strip out/ffmpeg out/ffprobe || true
          ( cd out && shasum -a 256 ffmpeg ffprobe | tee SHA256SUMS )
          tar -C out -czf histv-ffmpeg-macos-arm64.tar.gz ffmpeg ffprobe SHA256SUMS
          ls -lh out histv-ffmpeg-macos-arm64.tar.gz

      - name: Upload artefact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: histv-ffmpeg-macos-arm64
          path: histv-ffmpeg-macos-arm64.tar.gz
          retention-days: 30

  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Set up MSYS2 (MINGW64)
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel git
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            autoconf automake libtool

      - name: Prepare prefix
        run: |
          set -euo pipefail
          echo "PREFIX=$HOME/ffbuild/prefix" >> "$GITHUB_ENV"
          echo "SRC=$HOME/ffbuild/src" >> "$GITHUB_ENV"
          mkdir -p "$HOME/ffbuild/prefix/lib/pkgconfig" "$HOME/ffbuild/prefix/include" "$HOME/ffbuild/src"
          echo "PKG_CONFIG_PATH=$HOME/ffbuild/prefix/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Build x264 (static, pic, 8+10-bit)
        run: |
          set -euo pipefail
          cd "$SRC"
          git clone https://code.videolan.org/videolan/x264.git
          cd x264 && git checkout "$X264_COMMIT"
          ./configure --prefix="$PREFIX" --enable-static --enable-pic \
            --bit-depth=all --disable-cli --disable-opencl
          make -j"$(nproc)"
          make install

      - name: Build x265 (multilib 8/10/12-bit, static)
        run: |
          set -euo pipefail
          cd "$SRC"
          curl -fsSL --retry 3 -o x265.tar.gz "https://download.videolan.org/pub/videolan/x265/x265_${X265_VER}.tar.gz"
          echo "${X265_SHA256}  x265.tar.gz" | sha256sum -c -
          tar xzf x265.tar.gz
          cd "x265_${X265_VER}/source"
          mkdir -p 8bit 10bit 12bit
          cmake -S . -B 12bit -G Ninja -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DHIGH_BIT_DEPTH=ON -DMAIN12=ON -DEXPORT_C_API=OFF \
            -DENABLE_SHARED=OFF -DENABLE_CLI=OFF -DENABLE_HDR10_PLUS=OFF
          ninja -C 12bit
          cmake -S . -B 10bit -G Ninja -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DHIGH_BIT_DEPTH=ON -DEXPORT_C_API=OFF \
            -DENABLE_SHARED=OFF -DENABLE_CLI=OFF -DENABLE_HDR10_PLUS=OFF
          ninja -C 10bit
          ln -sf ../10bit/libx265.a 8bit/libx265_main10.a
          ln -sf ../12bit/libx265.a 8bit/libx265_main12.a
          cmake -S . -B 8bit -G Ninja -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DENABLE_SHARED=OFF -DENABLE_CLI=OFF -DENABLE_HDR10_PLUS=OFF \
            -DEXTRA_LIB="x265_main10.a;x265_main12.a" \
            -DEXTRA_LINK_FLAGS=-L. -DLINKED_10BIT=ON -DLINKED_12BIT=ON
          ninja -C 8bit
          ninja -C 8bit install
          cd 8bit
          mv libx265.a libx265_main.a
          ar -M <<'EOF'
          CREATE libx265.a
          ADDLIB libx265_main.a
          ADDLIB libx265_main10.a
          ADDLIB libx265_main12.a
          SAVE
          END
          EOF
          ranlib libx265.a
          cp -f libx265.a "$PREFIX/lib/libx265.a"

      - name: Build SVT-AV1 (static, no LTO)
        run: |
          set -euo pipefail
          cd "$SRC"
          git clone --depth 1 -b "$SVTAV1_TAG" https://gitlab.com/AOMediaCodec/SVT-AV1.git
          cmake -S SVT-AV1 -B SVT-AV1/Build -G Ninja -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF -DENABLE_AVX512=ON -DSVT_AV1_LTO=OFF
          ninja -C SVT-AV1/Build install

      - name: Build zimg (static)
        run: |
          set -euo pipefail
          cd "$SRC"
          git clone --depth 1 -b "$ZIMG_TAG" --recurse-submodules https://github.com/sekrit-twc/zimg.git
          cd zimg
          ./autogen.sh
          ./configure --prefix="$PREFIX" --enable-static --disable-shared --with-pic
          make -j"$(nproc)"
          make install

      - name: Install nv-codec-headers (nvenc)
        run: |
          set -euo pipefail
          cd "$SRC"
          git clone --depth 1 -b "$NVHEADERS_TAG" https://github.com/FFmpeg/nv-codec-headers.git
          make -C nv-codec-headers install PREFIX="$PREFIX"

      - name: Install AMF headers (AMD HW encode)
        run: |
          set -euo pipefail
          cd "$SRC"
          git clone --depth 1 -b "$AMF_TAG" https://github.com/GPUOpen-LibrariesAndSDKs/AMF.git
          # Header-only (see linux job). AMF is the primary AMD path on Windows.
          mkdir -p "$PREFIX/include/AMF"
          cp -a AMF/amf/public/include/. "$PREFIX/include/AMF/"

      - name: Build libvpl (Intel QSV via oneVPL, static)
        run: |
          set -euo pipefail
          cd "$SRC"
          git clone --depth 1 -b "$LIBVPL_TAG" https://github.com/intel/libvpl.git
          # oneVPL dispatcher, static. POLICY_VERSION_MINIMUM keeps it building
          # under the cmake 4.x on the windows runner (same as x265/svtav1 here).
          cmake -S libvpl -B libvpl/_build -G Ninja -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTS=OFF -DBUILD_TOOLS=OFF -DBUILD_EXAMPLES=OFF
          ninja -C libvpl/_build
          ninja -C libvpl/_build install

      - name: Configure + build ffmpeg
        run: |
          set -euo pipefail
          cd "$SRC"
          git clone --depth 1 -b "$FFMPEG_TAG" https://github.com/FFmpeg/FFmpeg.git ffmpeg
          cd ffmpeg
          # The native mingw pkgconf can't resolve MSYS2 /home paths from the
          # (GITHUB_ENV-set, unconverted) PKG_CONFIG_PATH, so libsvtav1/libzimg
          # aren't found. Feed it a Windows/mixed path via cygpath.
          export PKG_CONFIG_PATH="$(cygpath -m "$PREFIX/lib/pkgconfig")"
          ./configure \
            --prefix="$PREFIX" \
            --pkg-config-flags=--static \
            --extra-cflags="-I$PREFIX/include" \
            --extra-ldflags="-L$PREFIX/lib -static -static-libgcc -static-libstdc++ -Wl,--allow-multiple-definition" \
            --extra-libs="-lstdc++ -lpthread" \
            --enable-gpl --enable-version3 \
            --enable-static --disable-shared \
            --disable-debug --disable-doc --disable-ffplay --enable-ffprobe \
            --disable-network --disable-indevs --disable-outdevs \
            --enable-libx264 --enable-libx265 --enable-libsvtav1 --enable-libzimg \
            --enable-ffnvcodec --enable-d3d11va --enable-dxva2 --enable-amf --enable-libvpl \
            --disable-filter=amf_capture,sr_amf,vpp_amf \
            --enable-runtime-cpudetect \
            || { echo "=== ffbuild/config.log (tail) ==="; tail -150 ffbuild/config.log; echo "=== SvtAv1Enc.pc ==="; cat "$PREFIX/lib/pkgconfig/SvtAv1Enc.pc" || true; echo "=== pkg-config probe ==="; PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig" pkg-config --exists --print-errors 'SvtAv1Enc >= 0.9.0' || true; exit 1; }
          make -j"$(nproc)"

      - name: Verify feature set
        run: |
          set -euo pipefail
          cd "$SRC/ffmpeg"
          ./ffmpeg.exe -hide_banner -version
          ./ffmpeg.exe -hide_banner -encoders | grep -E 'libx264|libx265|libsvtav1|nvenc' || { echo "MISSING expected encoder"; exit 1; }
          # AMD (amf) + Intel (qsv) HW encoders: compiled-in proof only (the CI
          # runner has no AMD/Intel GPU, so list them rather than run them).
          ./ffmpeg.exe -hide_banner -encoders | grep -q hevc_amf || { echo "MISSING amf (AMD) encoder"; exit 1; }
          ./ffmpeg.exe -hide_banner -encoders | grep -q hevc_qsv || { echo "MISSING qsv (Intel) encoder"; exit 1; }
          ./ffmpeg.exe -hide_banner -filters | grep -E 'zscale|tonemap' || { echo "MISSING zscale/tonemap"; exit 1; }
          ./ffmpeg.exe -hide_banner -bsfs | grep -E 'hevc_mp4toannexb|hevc_metadata' || { echo "MISSING hevc bsf"; exit 1; }
          # Native ffmpeg.exe can't read MSYS2 /dev/zero; make raw files in the
          # bash shell and use cwd-relative I/O to avoid path translation.
          head -c 400000 /dev/zero > raw8.yuv
          head -c 800000 /dev/zero > raw10.yuv
          ./ffmpeg.exe -hide_banner -y -f rawvideo -pix_fmt yuv420p -video_size 192x108 -i raw8.yuv -frames:v 5 -c:v libx264 -preset ultrafast h264.mp4
          ./ffmpeg.exe -hide_banner -y -f rawvideo -pix_fmt yuv420p -video_size 192x108 -i raw8.yuv -frames:v 5 -c:v libx265 -preset ultrafast hevc.mkv
          ./ffmpeg.exe -hide_banner -y -f rawvideo -pix_fmt yuv420p10le -video_size 192x108 -i raw10.yuv -frames:v 5 -c:v libx265 -preset ultrafast hevc10.mkv
          test -s h264.mp4 && test -s hevc.mkv && test -s hevc10.mkv

      - name: Collect + checksum
        run: |
          set -euo pipefail
          mkdir -p out
          cp "$SRC/ffmpeg/ffmpeg.exe" out/ffmpeg.exe
          cp "$SRC/ffmpeg/ffprobe.exe" out/ffprobe.exe
          strip out/ffmpeg.exe out/ffprobe.exe || true
          ( cd out && sha256sum ffmpeg.exe ffprobe.exe | tee SHA256SUMS )
          tar -C out -czf histv-ffmpeg-windows-x64.tar.gz ffmpeg.exe ffprobe.exe SHA256SUMS
          ls -lh out histv-ffmpeg-windows-x64.tar.gz

      - name: Upload artefact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: histv-ffmpeg-windows-x64
          path: histv-ffmpeg-windows-x64.tar.gz
          retention-days: 30

  publish:
    needs: [linux, macos, windows]
    # Publish whatever built: ship Linux to experimental even while macOS/Windows
    # are still being ironed out (don't let one platform block the others).
    if: ${{ !cancelled() && (github.event_name == 'push' || inputs.publish) && (needs.linux.result == 'success' || needs.macos.result == 'success' || needs.windows.result == 'success') }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download built ffmpeg artefacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Publish to ffmpeg-experimental prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          find dist -type f
          # Create the prerelease once; ignore if it already exists, then clobber assets.
          gh release view ffmpeg-experimental --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create ffmpeg-experimental \
              --repo "$GITHUB_REPOSITORY" \
              --prerelease \
              --title "Custom ffmpeg (experimental)" \
              --notes "Histv-tailored static ffmpeg built from pinned source (ffmpeg ${FFMPEG_TAG}, x265 ${X265_VER} multilib, x264 stable, SVT-AV1 ${SVTAV1_TAG}, zimg ${ZIMG_TAG}). HW encode: nvenc + vaapi + AMF ${AMF_TAG} (linux), nvenc + d3d11va/dxva2 + AMF ${AMF_TAG} (windows), Intel QSV via libvpl ${LIBVPL_TAG} (linux+windows), videotoolbox (macos). Experimental test builds - download the per-platform archive and swap it into histv to test."
          gh release upload ffmpeg-experimental --repo "$GITHUB_REPOSITORY" --clobber $(find dist -type f)
