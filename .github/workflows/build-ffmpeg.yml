# Build a histv-tailored, fully source-pinned static ffmpeg/ffprobe.
#
# Why this exists: histv used to download prebuilt ffmpeg from third parties
# (BtbN dated autobuilds, gyan.dev, evermeet.cx). The BtbN pin expired upstream
# and 404'd the whole build. Building from pinned source removes that failure
# mode permanently, gives a native macOS arm64 binary (evermeet is Intel-only),
# and lets us strip ffmpeg to exactly what histv uses.
#
# Feature set + recipe come from bakeoff/qa/ffmpeg-custom-build-plan.md:
# "curated GPL static" - x264 + x265 (multilib 8/10/12-bit for HDR) + SVT-AV1 +
# dav1d (software AV1 decode) + zimg (zscale tonemap) + opus/vorbis/lame audio +
# HW accel, with network/devices/ffplay stripped (lavfi kept: histv's encoder
# detection reads `-f lavfi`). No Dolby Vision in ffmpeg (histv does DV/HDR10+
# in Rust). No source patches.
#
# tools/ffmpeg/verify.sh is the conformance check every job runs against the
# stripped binaries before packaging; tools/ffmpeg/package.sh writes the
# archives (flat: ffmpeg, ffprobe, SHA256SUMS, LICENSE.txt, BUILDINFO.txt).
#
# Publishing: `experimental` (default, and every push) refreshes the moving
# `ffmpeg-experimental` prerelease. `release` (dispatch only) creates the
# immutable tag ffmpeg-${FFMPEG_TAG}-histv.${HISTV_FFMPEG_REV}; bump
# HISTV_FFMPEG_REV for every new release of the same ffmpeg version.
name: Build ffmpeg (custom)

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the built archives"
        type: boolean
        default: true
      channel:
        description: "experimental: refresh the ffmpeg-experimental prerelease. release: create the versioned, immutable release"
        type: choice
        options: [experimental, release]
        default: experimental
  # Rebuild whenever the build itself changes (so we can iterate from a feature
  # branch without it being on the default branch for dispatch, and without
  # running on unrelated pushes).
  push:
    branches: ["ci/ffmpeg-**", "preview/**"]
    paths: [".github/workflows/build-ffmpeg.yml", "tools/ffmpeg/**"]

permissions:
  contents: read

concurrency:
  # Releases get their own group and are never cancelled mid-publish.
  group: build-ffmpeg-${{ inputs.channel || 'experimental' }}
  cancel-in-progress: ${{ inputs.channel != 'release' }}

env:
  # Bump for every published release of the same FFMPEG_TAG.
  HISTV_FFMPEG_REV: "1"
  # Source pins (verified to exist at authoring time; tarballs are checked
  # against the SHA-256 below and recorded in each archive's BUILDINFO.txt).
  # Bump deliberately, never to a floating branch/latest.
  FFMPEG_TAG: "n8.1.1"
  X264_COMMIT: "b35605ace3ddf7c1a5d67a2eb553f034aef41d55" # videolan/x264 stable
  X265_VER: "4.2" # videolan release tarball; 4.2 CMakeLists is CMake-4.x clean (4.1 set removed policies to OLD)
  X265_SHA256: "40b1ea0453e0309f0eba934e0ddf533f8f6295966679e8894e8f1c1c8d5e1210"
  SVTAV1_TAG: "v3.1.2"
  ZIMG_TAG: "release-3.0.5"
  # Software AV1 decode: ffmpeg's native av1 decoder is hwaccel-only.
  DAV1D_URL: "https://downloads.videolan.org/pub/videolan/dav1d/1.5.5/dav1d-1.5.5.tar.xz"
  DAV1D_SHA256: "ca96b1d0ba3f01f55de7231d775892b64994ba061aaeeaaa4f662a390b3abf9e"
  # Audio encoders histv emits: libopus, libvorbis, and "mp3" (resolves to libmp3lame).
  OPUS_URL: "https://downloads.xiph.org/releases/opus/opus-1.6.1.tar.gz"
  OPUS_SHA256: "6ffcb593207be92584df15b32466ed64bbec99109f007c82205f0194572411a1"
  OGG_URL: "https://downloads.xiph.org/releases/ogg/libogg-1.3.6.tar.gz"
  OGG_SHA256: "83e6704730683d004d20e21b8f7f55dcb3383cdf84c0daedf30bde175f774638"
  VORBIS_URL: "https://downloads.xiph.org/releases/vorbis/libvorbis-1.3.7.tar.gz"
  VORBIS_SHA256: "0e982409a9c3fc82ee06e08205b1355e5c6aa4c36bca58146ef399621b0ce5ab"
  LAME_URL: "https://downloads.sourceforge.net/project/lame/lame/3.100/lame-3.100.tar.gz"
  LAME_SHA256: "ddfe36cab873794038ae2c1210557ad34857a4b6bdc515785d1da9e175b1da1e"
  # Linux only: linked statically so the binary needs nothing beyond glibc.
  ZLIB_URL: "https://github.com/madler/zlib/releases/download/v1.3.2/zlib-1.3.2.tar.gz"
  ZLIB_SHA256: "bb329a0a2cd0274d05519d61c667c062e06990d72e125ee2dfa8de64f0119d16"
  LIBDRM_URL: "https://dri.freedesktop.org/libdrm/libdrm-2.4.134.tar.xz"
  LIBDRM_SHA256: "ac5e74d157830eb8bee44c6a6bf3ad49774ef0dd2a72bdad74a8f20308b52a95"
  # Static libva loads the system's VA drivers (dlopen) and accepts drivers
  # built against this libva version or older. Keep it at the newest release.
  LIBVA_URL: "https://github.com/intel/libva/releases/download/2.24.1/libva-2.24.1.tar.bz2"
  LIBVA_SHA256: "eec6050b52876f229bd35e9df17cd31a06785e18e6f7990c445b584628483d67"
  NVHEADERS_TAG: "n12.2.72.0"
  # AMD HW encode (h264/hevc/av1_amf). Header-only: ffmpeg's configure requires
  # AMF_VERSION >= 0x0001000400240000 (= 1.4.36); the runtime lib is the user's
  # AMD GPU driver. linux + windows (not a macOS concept).
  AMF_TAG: "v1.4.36"
  # Intel QSV via the oneVPL dispatcher (h264/hevc/av1_qsv). ffmpeg
  # --enable-libvpl probes pkg-config for "vpl >= 2.6". linux + windows.
  LIBVPL_TAG: "v2.15.0"

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out build scripts
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install build tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            nasm cmake ninja-build meson pkg-config build-essential git \
            autoconf automake libtool curl ca-certificates xz-utils bzip2
          echo "PREFIX=$HOME/ffbuild/prefix" >> "$GITHUB_ENV"
          echo "SRC=$HOME/ffbuild/src" >> "$GITHUB_ENV"
          echo "TOOLS=$GITHUB_WORKSPACE/tools/ffmpeg" >> "$GITHUB_ENV"

      - name: Prepare prefix
        run: |
          set -euo pipefail
          mkdir -p "$PREFIX/lib/pkgconfig" "$PREFIX/include" "$SRC"
          echo "PKG_CONFIG_PATH=$PREFIX/lib/pkgconfig" >> "$GITHUB_ENV"
          # x265, libvpl and ffmpeg's --extra-libs all ask for -lstdc++. With only
          # the static archive in the first -L directory, that resolves to
          # libstdc++.a and the binary does not need libstdc++.so at run time.
          ln -sf "$(g++ -print-file-name=libstdc++.a)" "$PREFIX/lib/libstdc++.a"

      - name: Build x264 (static, pic, 8+10-bit)
        run: |
          set -euo pipefail
          cd "$SRC"
          git clone https://code.videolan.org/videolan/x264.git
          cd x264 && git checkout "$X264_COMMIT"
          ./configure --prefix="$PREFIX" --enable-static --enable-pic \
            --bit-depth=all --disable-cli --disable-opencl
          make -j"$(nproc)"
          make install

      - name: Build x265 (multilib 8/10/12-bit, static)
        run: |
          set -euo pipefail
          cd "$SRC"
          curl -fsSL --retry 3 -o x265.tar.gz "https://download.videolan.org/pub/videolan/x265/x265_${X265_VER}.tar.gz"
          echo "${X265_SHA256}  x265.tar.gz" | sha256sum -c -
          tar xzf x265.tar.gz
          cd "x265_${X265_VER}/source"
          mkdir -p 8bit 10bit 12bit

          # 12-bit (Main12)
          cmake -S . -B 12bit -G Ninja \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DHIGH_BIT_DEPTH=ON -DMAIN12=ON -DEXPORT_C_API=OFF -DENABLE_LIBNUMA=OFF \
            -DENABLE_SHARED=OFF -DENABLE_CLI=OFF -DENABLE_HDR10_PLUS=OFF
          ninja -C 12bit

          # 10-bit (Main10)
          cmake -S . -B 10bit -G Ninja \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DHIGH_BIT_DEPTH=ON -DEXPORT_C_API=OFF -DENABLE_LIBNUMA=OFF \
            -DENABLE_SHARED=OFF -DENABLE_CLI=OFF -DENABLE_HDR10_PLUS=OFF
          ninja -C 10bit

          # 8-bit linked against the 10/12-bit libs
          ln -sf ../10bit/libx265.a 8bit/libx265_main10.a
          ln -sf ../12bit/libx265.a 8bit/libx265_main12.a
          cmake -S . -B 8bit -G Ninja \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" -DENABLE_LIBNUMA=OFF \
            -DENABLE_SHARED=OFF -DENABLE_CLI=OFF -DENABLE_HDR10_PLUS=OFF \
            -DEXTRA_LIB="x265_main10.a;x265_main12.a" \
            -DEXTRA_LINK_FLAGS=-L. -DLINKED_10BIT=ON -DLINKED_12BIT=ON
          ninja -C 8bit
          ninja -C 8bit install

          # Merge the three static archives into one fat libx265.a
          cd 8bit
          mv libx265.a libx265_main.a
          ar -M <<'EOF'
          CREATE libx265.a
          ADDLIB libx265_main.a
          ADDLIB libx265_main10.a
          ADDLIB libx265_main12.a
          SAVE
          END
          EOF
          ranlib libx265.a
          cp -f libx265.a "$PREFIX/lib/libx265.a"
          # x265.pc lists the compiler's implicit libs, including -lgcc_s, which
          # would make libgcc_s.so.1 a run-time dependency. ffmpeg links with
          # -static-libgcc, which supplies the unwinder statically instead.
          sed -i 's/-lgcc_s//g' "$PREFIX/lib/pkgconfig/x265.pc"

      - name: Build SVT-AV1 (static, no LTO)
        run: |
          set -euo pipefail
          cd "$SRC"
          git clone --depth 1 -b "$SVTAV1_TAG" https://gitlab.com/AOMediaCodec/SVT-AV1.git
          cmake -S SVT-AV1 -B SVT-AV1/Build -G Ninja \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF -DENABLE_AVX512=ON -DSVT_AV1_LTO=OFF
          ninja -C SVT-AV1/Build install

      - name: Build dav1d (static)
        run: |
          set -euo pipefail
          cd "$SRC"
          bash "$TOOLS/fetch.sh" "$DAV1D_URL" "$DAV1D_SHA256" dav1d
          meson setup dav1d/build dav1d --prefix="$PREFIX" --libdir=lib \
            --buildtype=release --default-library=static \
            -Denable_tools=false -Denable_tests=false
          ninja -C dav1d/build install

      - name: Build zimg (static)
        run: |
          set -euo pipefail
          cd "$SRC"
          git clone --depth 1 -b "$ZIMG_TAG" --recurse-submodules https://github.com/sekrit-twc/zimg.git
          cd zimg
          ./autogen.sh
          ./configure --prefix="$PREFIX" --enable-static --disable-shared --with-pic
          make -j"$(nproc)"
          make install

      - name: Build libopus, libogg, libvorbis (static)
        run: |
          set -euo pipefail
          cd "$SRC"
          bash "$TOOLS/fetch.sh" "$OPUS_URL" "$OPUS_SHA256" opus
          bash "$TOOLS/fetch.sh" "$OGG_URL" "$OGG_SHA256" ogg
          bash "$TOOLS/fetch.sh" "$VORBIS_URL" "$VORBIS_SHA256" vorbis
          # CMake rather than autotools: libvorbis 1.3.7's configure adds
          # -force_cpusubtype_ALL on Darwin; using one recipe on every platform.
          for lib in opus ogg vorbis; do
            cmake -S "$lib" -B "$lib/build" -G Ninja -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
              -DCMAKE_INSTALL_PREFIX="$PREFIX" -DCMAKE_INSTALL_LIBDIR=lib \
              -DCMAKE_PREFIX_PATH="$PREFIX" -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTING=OFF \
              -DOPUS_BUILD_TESTING=OFF -DOPUS_BUILD_PROGRAMS=OFF
            ninja -C "$lib/build" install
          done

      - name: Build libmp3lame (static)
        run: |
          set -euo pipefail
          cd "$SRC"
          bash "$TOOLS/fetch.sh" "$LAME_URL" "$LAME_SHA256" lame
          cd lame
          ./configure --prefix="$PREFIX" --enable-static --disable-shared \
            --disable-frontend --disable-decoder --disable-gtktest
          make -j"$(nproc)"
          make install

      - name: Build zlib (static)
        run: |
          set -euo pipefail
          cd "$SRC"
          bash "$TOOLS/fetch.sh" "$ZLIB_URL" "$ZLIB_SHA256" zlib
          cd zlib
          ./configure --prefix="$PREFIX" --static
          make -j"$(nproc)"
          make install

      - name: Build libdrm + libva (static, DRM only)
        run: |
          set -euo pipefail
          cd "$SRC"
          # Only libdrm's core API is used (device probing for VAAPI); the
          # per-vendor KMS helpers are not.
          bash "$TOOLS/fetch.sh" "$LIBDRM_URL" "$LIBDRM_SHA256" libdrm
          meson setup libdrm/build libdrm --prefix="$PREFIX" --libdir=lib \
            --buildtype=release --default-library=static \
            -Dintel=disabled -Dradeon=disabled -Damdgpu=disabled -Dnouveau=disabled \
            -Dvmwgfx=disabled -Domap=disabled -Dexynos=disabled -Dfreedreno=disabled \
            -Dtegra=disabled -Dvc4=disabled -Detnaviv=disabled \
            -Dcairo-tests=disabled -Dman-pages=disabled -Dvalgrind=disabled \
            -Dtests=false -Dudev=false
          ninja -C libdrm/build install

          # libva: DRM backend only (no X11/Wayland/GLX), so nothing links
          # libX11/libxcb. Autotools because libva's meson build is shared-only.
          # The driver search path covers Debian/Ubuntu, Fedora/openSUSE and
          # Arch layouts, plus the Flatpak runtime's (intel/nvidia subdirs and
          # the GL extension); LIBVA_DRIVERS_PATH still overrides it at run time.
          bash "$TOOLS/fetch.sh" "$LIBVA_URL" "$LIBVA_SHA256" libva
          cd libva
          ./configure --prefix="$PREFIX" --sysconfdir=/etc \
            --enable-static --disable-shared --enable-drm \
            --disable-x11 --disable-glx --disable-wayland --disable-docs \
            --with-drivers-path="/usr/lib/x86_64-linux-gnu/dri:/usr/lib/x86_64-linux-gnu/dri/intel-vaapi-driver:/usr/lib/x86_64-linux-gnu/dri/nvidia-vaapi-driver:/usr/lib/x86_64-linux-gnu/GL/lib/dri:/usr/lib64/dri:/usr/lib/dri:/usr/local/lib/dri"
          make -j"$(nproc)"
          make install
          # Upstream libva-drm.pc assumes shared libs and omits libdrm. Without
          # it ffmpeg's static link test for vaGetDisplayDRM fails, vaapi_drm is
          # silently disabled, and VAAPI cannot open a render node.
          echo "Requires.private: libdrm" >> "$PREFIX/lib/pkgconfig/libva-drm.pc"

      - name: Install nv-codec-headers (nvenc)
        run: |
          set -euo pipefail
          cd "$SRC"
          git clone --depth 1 -b "$NVHEADERS_TAG" https://github.com/FFmpeg/nv-codec-headers.git
          make -C nv-codec-headers install PREFIX="$PREFIX"

      - name: Install AMF headers (AMD HW encode)
        run: |
          set -euo pipefail
          cd "$SRC"
          git clone --depth 1 -b "$AMF_TAG" https://github.com/GPUOpen-LibrariesAndSDKs/AMF.git
          # ffmpeg's configure checks for <AMF/core/Version.h>; AMF ships the
          # headers under amf/public/include. Header-only - the runtime AMF lib
          # is the user's AMD GPU driver, loaded at runtime.
          mkdir -p "$PREFIX/include/AMF"
          cp -a AMF/amf/public/include/. "$PREFIX/include/AMF/"

      - name: Build libvpl (Intel QSV via oneVPL, static)
        run: |
          set -euo pipefail
          cd "$SRC"
          git clone --depth 1 -b "$LIBVPL_TAG" https://github.com/intel/libvpl.git
          # The oneVPL dispatcher. Builds shared by default; force static so the
          # ffmpeg binary stays self-contained. Installs lib/pkgconfig/vpl.pc,
          # which ffmpeg --enable-libvpl probes for (needs vpl >= 2.6).
          cmake -S libvpl -B libvpl/_build -G Ninja \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" -DCMAKE_INSTALL_LIBDIR=lib -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTS=OFF -DBUILD_TOOLS=OFF -DBUILD_EXAMPLES=OFF
          ninja -C libvpl/_build
          ninja -C libvpl/_build install

      - name: Configure + build ffmpeg
        run: |
          set -euo pipefail
          cd "$SRC"
          git clone --depth 1 -b "$FFMPEG_TAG" https://github.com/FFmpeg/FFmpeg.git ffmpeg
          cd ffmpeg
          # --disable-autodetect: only what is named here gets linked, so the
          # runner's preinstalled -dev packages (X11, xcb, bz2, lzma, ...) cannot
          # leak in as shared-library dependencies.
          ./configure \
            --prefix="$PREFIX" \
            --pkg-config-flags=--static \
            --extra-cflags="-I$PREFIX/include" \
            --extra-ldflags="-L$PREFIX/lib -static-libgcc" \
            --extra-libs="-lstdc++ -lpthread -lm -ldl" \
            --enable-gpl --enable-version3 \
            --enable-static --disable-shared \
            --disable-autodetect \
            --disable-debug --disable-doc --disable-ffplay --enable-ffprobe \
            --disable-network --disable-indevs --enable-indev=lavfi --disable-outdevs \
            --enable-zlib \
            --enable-libx264 --enable-libx265 --enable-libsvtav1 --enable-libdav1d --enable-libzimg \
            --enable-libopus --enable-libvorbis --enable-libmp3lame \
            --enable-vaapi --enable-libdrm \
            --enable-ffnvcodec --enable-cuda --enable-cuvid --enable-nvdec --enable-nvenc \
            --enable-amf --enable-libvpl \
            --disable-filter=amf_capture,sr_amf,vpp_amf \
            --enable-runtime-cpudetect
          # Sub-features that configure drops silently when a link test fails;
          # the encoders still list, so verify.sh's name checks cannot see it.
          for def in CONFIG_VAAPI HAVE_VAAPI_DRM CONFIG_LIBDRM CONFIG_NVENC CONFIG_LIBVPL CONFIG_AMF CONFIG_ZLIB; do
            grep -q "^#define $def 1\$" config.h || { echo "::error::configure did not enable $def (see ffbuild/config.log)"; exit 1; }
          done
          make -j"$(nproc)"

      - name: Stage binaries
        run: |
          set -euo pipefail
          mkdir -p out
          cp "$SRC/ffmpeg/ffmpeg" "$SRC/ffmpeg/ffprobe" out/
          strip out/ffmpeg out/ffprobe
          ls -l out

      - name: Verify feature set
        run: |
          set -euo pipefail
          bash "$TOOLS/verify.sh" out linux

      - name: Package
        run: |
          set -euo pipefail
          bash "$TOOLS/package.sh" out "$SRC/ffmpeg" histv-ffmpeg-linux-x64.tar.gz linux

      - name: Upload artefact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: histv-ffmpeg-linux-x64
          path: histv-ffmpeg-linux-x64.tar.gz
          retention-days: 30

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native builds on both architectures, so verify.sh runs the binary it
          # ships. Labels from the GitHub-hosted runner reference (macos-14 is no
          # longer listed there).
          - arch: arm64
            ffarch: arm64
            runner: macos-15
          - arch: x64
            ffarch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    env:
      # Without this, clang targets the runner's own macOS version.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - name: Check out build scripts
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install build tooling
        run: |
          set -euo pipefail
          brew install nasm cmake ninja meson pkg-config autoconf automake libtool
          echo "PREFIX=$HOME/ffbuild/prefix" >> "$GITHUB_ENV"
          echo "SRC=$HOME/ffbuild/src" >> "$GITHUB_ENV"
          echo "TOOLS=$GITHUB_WORKSPACE/tools/ffmpeg" >> "$GITHUB_ENV"

      - name: Prepare prefix
        run: |
          set -euo pipefail
          mkdir -p "$PREFIX/lib/pkgconfig" "$PREFIX/include" "$SRC"
          echo "PKG_CONFIG_PATH=$PREFIX/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Build x264 (static, pic, 8+10-bit)
        run: |
          set -euo pipefail
          cd "$SRC"
          git clone https://code.videolan.org/videolan/x264.git
          cd x264 && git checkout "$X264_COMMIT"
          ./configure --prefix="$PREFIX" --enable-static --enable-pic \
            --bit-depth=all --disable-cli --disable-opencl
          make -j"$(sysctl -n hw.ncpu)"
          make install

      - name: Build x265 (multilib 8/10/12-bit, static)
        run: |
          set -euo pipefail
          cd "$SRC"
          curl -fsSL --retry 3 -o x265.tar.gz "https://download.videolan.org/pub/videolan/x265/x265_${X265_VER}.tar.gz"
          echo "${X265_SHA256}  x265.tar.gz" | shasum -a 256 -c -
          tar xzf x265.tar.gz
          cd "x265_${X265_VER}/source"
          mkdir -p 8bit 10bit 12bit
          cmake -S . -B 12bit -G Ninja -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DHIGH_BIT_DEPTH=ON -DMAIN12=ON -DEXPORT_C_API=OFF \
            -DENABLE_SHARED=OFF -DENABLE_CLI=OFF -DENABLE_HDR10_PLUS=OFF
          ninja -C 12bit
          cmake -S . -B 10bit -G Ninja -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DHIGH_BIT_DEPTH=ON -DEXPORT_C_API=OFF \
            -DENABLE_SHARED=OFF -DENABLE_CLI=OFF -DENABLE_HDR10_PLUS=OFF
          ninja -C 10bit
          ln -sf ../10bit/libx265.a 8bit/libx265_main10.a
          ln -sf ../12bit/libx265.a 8bit/libx265_main12.a
          cmake -S . -B 8bit -G Ninja -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DENABLE_SHARED=OFF -DENABLE_CLI=OFF -DENABLE_HDR10_PLUS=OFF \
            -DEXTRA_LIB="x265_main10.a;x265_main12.a" \
            -DEXTRA_LINK_FLAGS=-L. -DLINKED_10BIT=ON -DLINKED_12BIT=ON
          ninja -C 8bit
          ninja -C 8bit install
          # macOS ar lacks the -M (MRI script) mode; merge with Apple libtool.
          cd 8bit
          mv libx265.a libx265_main.a
          libtool -static -o libx265.a libx265_main.a libx265_main10.a libx265_main12.a
          cp -f libx265.a "$PREFIX/lib/libx265.a"

      - name: Build SVT-AV1 (static, no LTO)
        run: |
          set -euo pipefail
          cd "$SRC"
          git clone --depth 1 -b "$SVTAV1_TAG" https://gitlab.com/AOMediaCodec/SVT-AV1.git
          cmake -S SVT-AV1 -B SVT-AV1/Build -G Ninja \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF -DSVT_AV1_LTO=OFF
          ninja -C SVT-AV1/Build install

      - name: Build dav1d (static)
        run: |
          set -euo pipefail
          cd "$SRC"
          bash "$TOOLS/fetch.sh" "$DAV1D_URL" "$DAV1D_SHA256" dav1d
          meson setup dav1d/build dav1d --prefix="$PREFIX" --libdir=lib \
            --buildtype=release --default-library=static \
            -Denable_tools=false -Denable_tests=false
          ninja -C dav1d/build install

      - name: Build zimg (static)
        run: |
          set -euo pipefail
          cd "$SRC"
          git clone --depth 1 -b "$ZIMG_TAG" --recurse-submodules https://github.com/sekrit-twc/zimg.git
          cd zimg
          ./autogen.sh
          ./configure --prefix="$PREFIX" --enable-static --disable-shared --with-pic
          make -j"$(sysctl -n hw.ncpu)"
          make install

      - name: Build libopus, libogg, libvorbis (static)
        run: |
          set -euo pipefail
          cd "$SRC"
          bash "$TOOLS/fetch.sh" "$OPUS_URL" "$OPUS_SHA256" opus
          bash "$TOOLS/fetch.sh" "$OGG_URL" "$OGG_SHA256" ogg
          bash "$TOOLS/fetch.sh" "$VORBIS_URL" "$VORBIS_SHA256" vorbis
          for lib in opus ogg vorbis; do
            cmake -S "$lib" -B "$lib/build" -G Ninja -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
              -DCMAKE_INSTALL_PREFIX="$PREFIX" -DCMAKE_INSTALL_LIBDIR=lib \
              -DCMAKE_PREFIX_PATH="$PREFIX" -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTING=OFF \
              -DOPUS_BUILD_TESTING=OFF -DOPUS_BUILD_PROGRAMS=OFF
            ninja -C "$lib/build" install
          done

      - name: Build libmp3lame (static)
        run: |
          set -euo pipefail
          cd "$SRC"
          bash "$TOOLS/fetch.sh" "$LAME_URL" "$LAME_SHA256" lame
          cd lame
          ./configure --prefix="$PREFIX" --enable-static --disable-shared \
            --disable-frontend --disable-decoder --disable-gtktest
          make -j"$(sysctl -n hw.ncpu)"
          make install

      - name: Configure + build ffmpeg
        run: |
          set -euo pipefail
          cd "$SRC"
          git clone --depth 1 -b "$FFMPEG_TAG" https://github.com/FFmpeg/FFmpeg.git ffmpeg
          cd ffmpeg
          # --disable-autodetect: Homebrew lives in the default search path on
          # Intel runners (/usr/local), so autodetected xz/iconv/etc. would link
          # as Homebrew dylibs that users do not have.
          ./configure \
            --prefix="$PREFIX" \
            --pkg-config-flags=--static \
            --extra-cflags="-I$PREFIX/include" \
            --extra-ldflags="-L$PREFIX/lib" \
            --extra-libs="-lc++" \
            --enable-gpl --enable-version3 \
            --enable-static --disable-shared \
            --disable-autodetect \
            --disable-debug --disable-doc --disable-ffplay --enable-ffprobe \
            --disable-network --disable-indevs --enable-indev=lavfi --disable-outdevs \
            --enable-zlib \
            --enable-libx264 --enable-libx265 --enable-libsvtav1 --enable-libdav1d --enable-libzimg \
            --enable-libopus --enable-libvorbis --enable-libmp3lame \
            --enable-videotoolbox --enable-audiotoolbox \
            --arch=${{ matrix.ffarch }} --enable-runtime-cpudetect
          make -j"$(sysctl -n hw.ncpu)"

      - name: Stage binaries
        run: |
          set -euo pipefail
          mkdir -p out
          cp "$SRC/ffmpeg/ffmpeg" "$SRC/ffmpeg/ffprobe" out/
          strip out/ffmpeg out/ffprobe
          ls -l out

      - name: Verify feature set
        run: |
          set -euo pipefail
          bash "$TOOLS/verify.sh" out macos

      - name: Package
        run: |
          set -euo pipefail
          bash "$TOOLS/package.sh" out "$SRC/ffmpeg" "histv-ffmpeg-macos-${{ matrix.arch }}.zip" macos

      - name: Upload artefact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: histv-ffmpeg-macos-${{ matrix.arch }}
          path: histv-ffmpeg-macos-${{ matrix.arch }}.zip
          retention-days: 30

  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Check out build scripts
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up MSYS2 (MINGW64)
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel git zip xz
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-pkgconf
            autoconf automake libtool

      - name: Prepare prefix
        run: |
          set -euo pipefail
          echo "PREFIX=$HOME/ffbuild/prefix" >> "$GITHUB_ENV"
          echo "SRC=$HOME/ffbuild/src" >> "$GITHUB_ENV"
          echo "TOOLS=$(cygpath -u "$GITHUB_WORKSPACE")/tools/ffmpeg" >> "$GITHUB_ENV"
          mkdir -p "$HOME/ffbuild/prefix/lib/pkgconfig" "$HOME/ffbuild/prefix/include" "$HOME/ffbuild/src"
          echo "PKG_CONFIG_PATH=$HOME/ffbuild/prefix/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Build x264 (static, pic, 8+10-bit)
        run: |
          set -euo pipefail
          cd "$SRC"
          git clone https://code.videolan.org/videolan/x264.git
          cd x264 && git checkout "$X264_COMMIT"
          ./configure --prefix="$PREFIX" --enable-static --enable-pic \
            --bit-depth=all --disable-cli --disable-opencl
          make -j"$(nproc)"
          make install

      - name: Build x265 (multilib 8/10/12-bit, static)
        run: |
          set -euo pipefail
          cd "$SRC"
          curl -fsSL --retry 3 -o x265.tar.gz "https://download.videolan.org/pub/videolan/x265/x265_${X265_VER}.tar.gz"
          echo "${X265_SHA256}  x265.tar.gz" | sha256sum -c -
          tar xzf x265.tar.gz
          cd "x265_${X265_VER}/source"
          mkdir -p 8bit 10bit 12bit
          cmake -S . -B 12bit -G Ninja -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DHIGH_BIT_DEPTH=ON -DMAIN12=ON -DEXPORT_C_API=OFF \
            -DENABLE_SHARED=OFF -DENABLE_CLI=OFF -DENABLE_HDR10_PLUS=OFF
          ninja -C 12bit
          cmake -S . -B 10bit -G Ninja -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DHIGH_BIT_DEPTH=ON -DEXPORT_C_API=OFF \
            -DENABLE_SHARED=OFF -DENABLE_CLI=OFF -DENABLE_HDR10_PLUS=OFF
          ninja -C 10bit
          ln -sf ../10bit/libx265.a 8bit/libx265_main10.a
          ln -sf ../12bit/libx265.a 8bit/libx265_main12.a
          cmake -S . -B 8bit -G Ninja -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DENABLE_SHARED=OFF -DENABLE_CLI=OFF -DENABLE_HDR10_PLUS=OFF \
            -DEXTRA_LIB="x265_main10.a;x265_main12.a" \
            -DEXTRA_LINK_FLAGS=-L. -DLINKED_10BIT=ON -DLINKED_12BIT=ON
          ninja -C 8bit
          ninja -C 8bit install
          cd 8bit
          mv libx265.a libx265_main.a
          ar -M <<'EOF'
          CREATE libx265.a
          ADDLIB libx265_main.a
          ADDLIB libx265_main10.a
          ADDLIB libx265_main12.a
          SAVE
          END
          EOF
          ranlib libx265.a
          cp -f libx265.a "$PREFIX/lib/libx265.a"

      - name: Build SVT-AV1 (static, no LTO)
        run: |
          set -euo pipefail
          cd "$SRC"
          git clone --depth 1 -b "$SVTAV1_TAG" https://gitlab.com/AOMediaCodec/SVT-AV1.git
          cmake -S SVT-AV1 -B SVT-AV1/Build -G Ninja -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF -DENABLE_AVX512=ON -DSVT_AV1_LTO=OFF
          ninja -C SVT-AV1/Build install

      - name: Build dav1d (static)
        run: |
          set -euo pipefail
          cd "$SRC"
          bash "$TOOLS/fetch.sh" "$DAV1D_URL" "$DAV1D_SHA256" dav1d
          meson setup dav1d/build dav1d --prefix="$PREFIX" --libdir=lib \
            --buildtype=release --default-library=static \
            -Denable_tools=false -Denable_tests=false
          ninja -C dav1d/build install

      - name: Build zimg (static)
        run: |
          set -euo pipefail
          cd "$SRC"
          git clone --depth 1 -b "$ZIMG_TAG" --recurse-submodules https://github.com/sekrit-twc/zimg.git
          cd zimg
          ./autogen.sh
          ./configure --prefix="$PREFIX" --enable-static --disable-shared --with-pic
          make -j"$(nproc)"
          make install

      - name: Build libopus, libogg, libvorbis (static)
        run: |
          set -euo pipefail
          cd "$SRC"
          bash "$TOOLS/fetch.sh" "$OPUS_URL" "$OPUS_SHA256" opus
          bash "$TOOLS/fetch.sh" "$OGG_URL" "$OGG_SHA256" ogg
          bash "$TOOLS/fetch.sh" "$VORBIS_URL" "$VORBIS_SHA256" vorbis
          # On MinGW, opus's stack protector / fortify options add -lssp to
          # opus.pc, which the fully static ffmpeg link does not want.
          for lib in opus ogg vorbis; do
            cmake -S "$lib" -B "$lib/build" -G Ninja -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
              -DCMAKE_INSTALL_PREFIX="$PREFIX" -DCMAKE_INSTALL_LIBDIR=lib \
              -DCMAKE_PREFIX_PATH="$PREFIX" -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTING=OFF \
              -DOPUS_BUILD_TESTING=OFF -DOPUS_BUILD_PROGRAMS=OFF \
              -DOPUS_STACK_PROTECTOR=OFF -DOPUS_FORTIFY_SOURCE=OFF
            ninja -C "$lib/build" install
          done

      - name: Build libmp3lame (static)
        run: |
          set -euo pipefail
          cd "$SRC"
          bash "$TOOLS/fetch.sh" "$LAME_URL" "$LAME_SHA256" lame
          cd lame
          ./configure --prefix="$PREFIX" --enable-static --disable-shared \
            --disable-frontend --disable-decoder --disable-gtktest
          make -j"$(nproc)"
          make install

      - name: Install nv-codec-headers (nvenc)
        run: |
          set -euo pipefail
          cd "$SRC"
          git clone --depth 1 -b "$NVHEADERS_TAG" https://github.com/FFmpeg/nv-codec-headers.git
          make -C nv-codec-headers install PREFIX="$PREFIX"

      - name: Install AMF headers (AMD HW encode)
        run: |
          set -euo pipefail
          cd "$SRC"
          git clone --depth 1 -b "$AMF_TAG" https://github.com/GPUOpen-LibrariesAndSDKs/AMF.git
          # Header-only (see linux job). AMF is the primary AMD path on Windows.
          mkdir -p "$PREFIX/include/AMF"
          cp -a AMF/amf/public/include/. "$PREFIX/include/AMF/"

      - name: Build libvpl (Intel QSV via oneVPL, static)
        run: |
          set -euo pipefail
          cd "$SRC"
          git clone --depth 1 -b "$LIBVPL_TAG" https://github.com/intel/libvpl.git
          # oneVPL dispatcher, static. POLICY_VERSION_MINIMUM keeps it building
          # under the cmake 4.x on the windows runner (same as x265/svtav1 here).
          cmake -S libvpl -B libvpl/_build -G Ninja -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTS=OFF -DBUILD_TOOLS=OFF -DBUILD_EXAMPLES=OFF
          ninja -C libvpl/_build
          ninja -C libvpl/_build install

      - name: Configure + build ffmpeg
        run: |
          set -euo pipefail
          cd "$SRC"
          git clone --depth 1 -b "$FFMPEG_TAG" https://github.com/FFmpeg/FFmpeg.git ffmpeg
          cd ffmpeg
          # The native mingw pkgconf can't resolve MSYS2 /home paths from the
          # (GITHUB_ENV-set, unconverted) PKG_CONFIG_PATH, so libsvtav1/libzimg
          # aren't found. Feed it a Windows/mixed path via cygpath.
          export PKG_CONFIG_PATH="$(cygpath -m "$PREFIX/lib/pkgconfig")"
          ./configure \
            --prefix="$PREFIX" \
            --pkg-config-flags=--static \
            --extra-cflags="-I$PREFIX/include" \
            --extra-ldflags="-L$PREFIX/lib -static -static-libgcc -static-libstdc++ -Wl,--allow-multiple-definition" \
            --extra-libs="-lstdc++ -lpthread" \
            --enable-gpl --enable-version3 \
            --enable-static --disable-shared \
            --disable-debug --disable-doc --disable-ffplay --enable-ffprobe \
            --disable-network --disable-indevs --enable-indev=lavfi --disable-outdevs \
            --enable-libx264 --enable-libx265 --enable-libsvtav1 --enable-libdav1d --enable-libzimg \
            --enable-libopus --enable-libvorbis --enable-libmp3lame \
            --enable-ffnvcodec --enable-d3d11va --enable-dxva2 --enable-amf --enable-libvpl \
            --disable-filter=amf_capture,sr_amf,vpp_amf \
            --enable-runtime-cpudetect
          make -j"$(nproc)"

      - name: Stage binaries
        run: |
          set -euo pipefail
          mkdir -p out
          cp "$SRC/ffmpeg/ffmpeg.exe" "$SRC/ffmpeg/ffprobe.exe" out/
          strip out/ffmpeg.exe out/ffprobe.exe
          ls -l out

      - name: Verify feature set
        run: |
          set -euo pipefail
          bash "$TOOLS/verify.sh" out windows

      - name: Package
        run: |
          set -euo pipefail
          bash "$TOOLS/package.sh" out "$SRC/ffmpeg" histv-ffmpeg-windows-x64.zip windows

      - name: Upload artefact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: histv-ffmpeg-windows-x64
          path: histv-ffmpeg-windows-x64.zip
          retention-days: 30

  publish:
    needs: [linux, macos, windows]
    # experimental: publish whatever built, so one platform still being ironed
    # out does not block the others. release: all four archives or nothing.
    if: >-
      ${{ !cancelled() && (github.event_name == 'push' || inputs.publish) && (
        (inputs.channel == 'release' && needs.linux.result == 'success' && needs.macos.result == 'success' && needs.windows.result == 'success') ||
        (inputs.channel != 'release' && (needs.linux.result == 'success' || needs.macos.result == 'success' || needs.windows.result == 'success'))
      ) }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      CHANNEL: ${{ inputs.channel || 'experimental' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download built ffmpeg artefacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: histv-ffmpeg-*
          path: dist
          merge-multiple: true

      - name: Checksum archives
        run: |
          set -euo pipefail
          cd dist
          sha256sum histv-ffmpeg-* | tee SHA256SUMS

      - name: Publish to ffmpeg-experimental prerelease
        if: env.CHANNEL != 'release'
        run: |
          set -euo pipefail
          tag=ffmpeg-experimental
          # Create the prerelease once; ignore if it already exists, then clobber assets.
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --prerelease \
              --title "Custom ffmpeg (experimental)" \
              --notes "Histv-tailored static ffmpeg built from pinned source (ffmpeg ${FFMPEG_TAG}). Experimental test builds; each archive's BUILDINFO.txt lists every source pin. Not for pinning: assets are replaced on every build, use a versioned ffmpeg-*-histv.* release instead."
          # Drop assets from earlier layouts (e.g. the old .tar.gz names) so the
          # prerelease only offers what this run built.
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | while IFS= read -r name; do
            [ -e "dist/$name" ] || gh release delete-asset "$tag" "$name" --repo "$GITHUB_REPOSITORY" --yes
          done
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber dist/*

      - name: Publish versioned release
        if: env.CHANNEL == 'release'
        run: |
          set -euo pipefail
          tag="ffmpeg-${FFMPEG_TAG}-histv.${HISTV_FFMPEG_REV}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists. Bump HISTV_FFMPEG_REV for a new build."
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "::error::Tag $tag already exists without a release. Bump HISTV_FFMPEG_REV."
            exit 1
          fi
          gh release create "$tag" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --latest=false \
            --title "ffmpeg ${FFMPEG_TAG} for histv (build ${HISTV_FFMPEG_REV})" \
            --notes "Histv-tailored static ffmpeg/ffprobe built from pinned, unmodified upstream source (ffmpeg ${FFMPEG_TAG}). Archives: linux-x64 (.tar.gz), macos-arm64, macos-x64 and windows-x64 (.zip), each with SHA256SUMS, LICENSE.txt (GPL v3) and BUILDINFO.txt. SHA256SUMS on this release covers the four archives. Assets on this tag are never replaced."
